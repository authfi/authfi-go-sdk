# Releases the module when a version tag (vX.Y.Z) is pushed. Go has no registry to upload to: the tag is the
# release, and the Go module proxy and checksum database learn it the first time anyone asks for it. This
# workflow tests the tagged commit, asks the proxy for it once (so the checksum database records the tag at the
# commit that was tested), and publishes a GitHub Release with the source archive, a provenance attestation and
# the changelog entry as notes. The `release` environment needs a reviewer's approval before the release job
# starts. A pushed tag is already a release for `go get`, so who may create `v*` tags is limited by a tag ruleset
# on this repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a version on main, with a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          v="${TAG#v}"
          grep -Eq "^## \[?${v//./\\.}\]?( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go mod verify

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Source archive and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          mkdir -p out
          git archive --format=zip --prefix="authfi-go-sdk-$v/" -o "out/authfi-go-sdk-$v.zip" HEAD
          awk -v v="$v" 'BEGIN{a="## "v; b="## ["v"]"} $0==a || index($0,a" ")==1 || $0==b || index($0,b" ")==1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > out/notes.md
          test -s out/notes.md || { echo "::error::no release notes for $v"; exit 1; }
      # The proxy fetches the tag from GitHub and the checksum database records it. Asking for it here makes that
      # happen at release time, and fails the release if the proxy cannot serve the tag.
      - name: The Go proxy serves the tag
        env:
          TAG: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=mod
        run: |
          cd "$(mktemp -d)"
          go mod init release-check
          for i in 1 2 3 4 5; do
            go get "github.com/${GITHUB_REPOSITORY}@${TAG}" && ok=1 && break
            sleep 10
          done
          test "${ok:-}" = 1
          go list -m -json "github.com/${GITHUB_REPOSITORY}" | grep -F "\"Version\": \"${TAG}\""
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.zip
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/*.zip --verify-tag --title "$TAG" --notes-file out/notes.md
